name: CI

# CI común (github.com/ikerlorente11/ci): en cada push, los tests y los tipos. La app la compila y publica EAS, no GitHub.
on:
  push:
    branches: [main]
    # Solo documentación: no lanza el CI (los lunes y a mano se ejecuta todo igualmente)
    paths-ignore: ["**.md", "docs/**", ".claude/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".claude/**", "LICENSE"]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    uses: ikerlorente11/ci/.github/workflows/node.yml@main
    with:
      test: "npm run typecheck && npm test"
